<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cohorte 2026 — XD Textile Responsable</title>
<meta name="description" content="Carte des 38 projets territoriaux de la cohorte 2026 — Extrême Défi Textile Responsable (ADEME).">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* Carte publique : pas de zoom ni de déplacement. Seuls les contours de
     région sont cliquables (page des projets de la région sur le site ADEME). */
  :root {
    --violet: #00008B;
    --vert: #CE2C23;
    --trait: #00008B;
    --label: #00008B;
    --fond: #FAF6EE;
  }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: 'DM Sans', system-ui, sans-serif; }
  .carte {
    position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100vh;
    background: var(--fond); overflow: hidden; border-radius: 0;
    user-select: none; -webkit-user-select: none;
  }
  #map { position: absolute; inset: 0; background: transparent; }
  .leaflet-container { background: transparent; font-family: inherit; }
  .point {
    width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%;
    background: var(--vert); border: 1.5px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .region-label {
    background: none; border: none; box-shadow: none; padding: 0;
    color: var(--label); font-weight: 700; font-size: clamp(7px, .9vw, 11px);
    letter-spacing: .5px; text-transform: uppercase; white-space: nowrap;
  }
  /* L'étiquette est centrée sur le NOMBRE ; le nom est posé au-dessus. */
  .region-label { position: absolute; transform: translate(-50%, -50%); line-height: 1; }
  .region-label .nb { margin-left: 0; display: flex; }
  .region-label .rl-nom { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: .3em;
    white-space: nowrap; text-align: center; line-height: 1.15;
    text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 4px #fff; }
  .region-label .rl-seul { display: block; }
  .nb {
    display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
    min-width: 1.75em; height: 1.75em; padding: 0 .4em; margin-left: .35em; border-radius: 1em;
    background: var(--violet); color: #fff; font-size: 1.05em; letter-spacing: 0; vertical-align: middle;
  }
  /* Encarts dimensionnés sur la HAUTEUR de la carte : jamais rognés, quelle
     que soit la forme du cadre qui l'intègre. */
  .encarts { position: absolute; left: 2%; bottom: 4%; height: 27%; z-index: 500; display: flex; gap: 10px; }
  .encart {
    height: 100%; aspect-ratio: 0.88; display: flex; flex-direction: column; background: #fff; border: 1px solid #d9d6d0; border-radius: 0; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .encart-titre {
    padding: 4px 6px; font-weight: 700; color: var(--label); text-transform: uppercase;
    font-size: clamp(7px, .8vw, 10px); letter-spacing: .5px; border-bottom: 1px solid #eee; white-space: nowrap;
  }
  .encart-carte { flex: 1; min-height: 0; background: var(--fond); }
  .region-lien { cursor: pointer; }
  /* Légende (coin haut gauche) */
  .legende {
    position: absolute; top: 4%; left: 2%; z-index: 500; background: #fff;
    padding: .7em .9em; color: var(--label); font-size: clamp(8px, .95vw, 12px); line-height: 1.35;
    display: grid; grid-template-columns: auto 1fr; gap: .45em .6em; align-items: center;
  }
  .legende .point { width: 1em; height: 1em; justify-self: center; }
  .legende .nb { margin-left: 0; font-size: .95em; }
  .legende-note { grid-column: 1 / -1; opacity: .85; padding-top: .15em; border-top: 1px solid #ebe8e2; }
  .leaflet-pane.leaflet-relief-pane { mix-blend-mode: multiply; }
  .encart { cursor: default; }
  .source {
    position: absolute; right: 1.5%; bottom: 2%; z-index: 500; color: #8a8780;
    font-size: clamp(7px, .7vw, 10px);
  }
</style>
</head>
<body>
<div class="carte" id="carte" aria-label="Carte des 38 projets de la cohorte 2026 par région">
  <div id="map"></div>
  <div class="legende" aria-hidden="true">
    <span class="point"></span><span>Projet de la cohorte 2026</span>
    <span class="nb">8</span><span>Nombre de projets par région</span>
    <span class="legende-note">Cliquez sur une région pour voir ses projets</span>
  </div>
  <div class="encarts" id="encarts"></div>
  <div class="source">Relief et contours : IGN · Etalab</div>
</div>
<script>
(async function () {
  'use strict';
  const NOMS_COURTS = {
    'Auvergne-Rhône-Alpes': 'Auvergne-R.-A.',
    'Bourgogne-Franche-Comté': 'Bourgogne-F.-C.',
    "Provence-Alpes-Côte d'Azur": 'PACA',
    'Île-de-France': 'IDF'   // région trop petite pour son nom complet sans déborder
  };
  const OUTRE_MER = ['Guadeloupe', 'Martinique', 'Guyane', 'La Réunion', 'Mayotte'];
  const STYLE_REGION = { color: '#00008B', weight: 1.4, fillColor: '#ffffff', fillOpacity: 1 };
  const STYLE_SURVOL = { fillColor: '#ebe8e2', color: '#00008B', weight: 2.4 };
  const COUL_FOND = '#FAF6EE';
  // Masque « tout sauf le territoire » : un grand rectangle percé des formes du
  // territoire. Recouvre le relief qui déborde des frontières.
  function masqueHors(m, feature, pad) {
    const polys = feature.geometry.type === 'MultiPolygon' ? feature.geometry.coordinates : [feature.geometry.coordinates];
    const b = L.geoJSON(feature).getBounds().pad(pad);
    const outer = [[b.getSouth() - 20, b.getWest() - 40], [b.getNorth() + 20, b.getWest() - 40], [b.getNorth() + 20, b.getEast() + 40], [b.getSouth() - 20, b.getEast() + 40]];
    const trous = polys.map(poly => poly[0].map(([lng, lat]) => [lat, lng]));
    m.createPane('masque').style.zIndex = 455;
    m.getPane('masque').style.pointerEvents = 'none';
    L.polygon([outer, ...trous], { pane: 'masque', interactive: false, stroke: false, fillColor: COUL_FOND, fillOpacity: 1 }).addTo(m);
    // Trait de côte redessiné par-dessus le masque.
    L.geoJSON(feature, { pane: 'masque', interactive: false, style: { color: '#00008B', weight: 1.4, fill: false } }).addTo(m);
  }
  // Relief : estompage IGN (Géoplateforme, données ouvertes), limité au
  // territoire français — transparent partout ailleurs. Posé AU-DESSUS du fond
  // blanc des régions en mode « multiplier », sous les points et étiquettes.
  function relief(m) {
    m.createPane('relief');
    const pane = m.getPane('relief');
    pane.style.zIndex = 450;
    pane.style.pointerEvents = 'none';
    L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW&STYLE=estompage_grayscale&TILEMATRIXSET=PM_0_15&FORMAT=image/png&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',
      { pane: 'relief', maxNativeZoom: 15, maxZoom: 19, opacity: 0.75, className: 'relief' }).addTo(m);
  }
  const SANS_INTERACTION = {
    zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false,
    doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false, tap: false,
    zoomSnap: 0, inertia: false
  };

  const [data, geo, france] = await Promise.all([
    fetch('data/projets.json').then(r => r.json()),
    fetch('data/regions.geojson').then(r => r.json()),
    fetch('data/france.geojson').then(r => r.json())
  ]);
  const projets = data.projets;
  const pagesRegions = data.pages_regions || {};
  // Contour de région cliquable → page des projets de la région (fenêtre
  // principale, la carte étant intégrée en iframe).
  function rendreCliquable(layer, nom) {
    const url = pagesRegions[nom];
    if (!url) return;
    layer.options.interactive = true;
    layer.options.className = 'region-lien';
    layer.on('mouseover', () => { layer.setStyle(STYLE_SURVOL); layer.bringToFront(); });
    layer.on('mouseout', () => layer.setStyle(STYLE_REGION));
    layer.on('click', () => { window.open(url, '_top'); });
  }
  const parRegion = {};
  projets.forEach(p => { parRegion[p.region] = (parRegion[p.region] || 0) + 1; });

  // Points à leur position exacte (adresse au registre SIRENE, sinon centre de
  // la commune — voir le champ « precision » de data/projets.json). Aucun
  // déplacement : des points voisins peuvent se superposer, le liseré blanc
  // les distingue et le nombre par région donne le compte.
  function dessinerPoints(map, couche, liste, tailleMin) {
    couche.clearLayers();
    // Taille du point proportionnelle à la largeur de la carte (lisible partout).
    const taille = Math.max(tailleMin || 6, Math.min(11, Math.round(map.getSize().x / 120)));
    liste.forEach(p => L.marker([p.lat, p.lng], {
      interactive: false, keyboard: false,
      icon: L.divIcon({ className: '', html: '<div class="point"></div>', iconSize: [taille, taille], iconAnchor: [taille / 2, taille / 2] })
    }).addTo(couche));
  }
  // Étiquette = nom (1 ou 2 lignes) + nombre. data.etiquettes_regions donne, pour
  // chaque région, le point du NOMBRE et le libellé retenus par le calcul : là où
  // l'étiquette entière a le plus de place, à l'intérieur de la région et loin des
  // points (nom complet sur une ligne quand il tient).
  const ETIQ = data.etiquettes_regions || {};
  function etiquette(nom) {
    const n = parRegion[nom] || 0;
    const lignes = (ETIQ[nom] && ETIQ[nom].lignes) || [NOMS_COURTS[nom] || nom];
    const libelle = lignes.map(e).join('<br>');
    return n ? `<span class="nb">${n}</span><span class="rl-nom">${libelle}</span>` : `<span class="rl-seul">${libelle}</span>`;
  }
  function e(t) { return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

  // ── Métropole ──────────────────────────────────────────────────────────────
  const map = L.map('map', SANS_INTERACTION);
  relief(map);
  const metro = { type: 'FeatureCollection', features: geo.features.filter(f => !OUTRE_MER.includes(f.properties.nom)) };
  const coucheMetro = L.geoJSON(metro, {
    style: STYLE_REGION,
    interactive: true,
    onEachFeature: (f, l) => rendreCliquable(l, f.properties.nom)
  }).addTo(map);
  masqueHors(map, france, 0.1);
  // Les noms de région passent sous les points (volet dédié, juste sous les marqueurs).
  map.createPane('etiquettes').style.zIndex = 590;
  coucheMetro.eachLayer(l => {
    const nom = l.feature.properties.nom;
    const a = ETIQ[nom] && ETIQ[nom].ancre;
    const pos = a ? L.latLng(a) : l.getBounds().getCenter();
    L.marker(pos, {
      interactive: false, keyboard: false, pane: 'etiquettes',
      icon: L.divIcon({ className: '', iconSize: null, html: `<div class="region-label">${etiquette(nom)}</div>` })
    }).addTo(map);
  });
  const points = L.layerGroup().addTo(map);
  const projetsMetro = projets.filter(p => !OUTRE_MER.includes(p.region));
  function cadrer() {
    map.invalidateSize();
    // Marge à gauche pour le titre et les encarts Outre-mer.
    const w = map.getSize().x;
    map.fitBounds(coucheMetro.getBounds(), { paddingTopLeft: [w * 0.12, 20], paddingBottomRight: [w * 0.04, 14], animate: false });
    dessinerPoints(map, points, projetsMetro);
  }

  // ── Encarts Outre-mer (uniquement ceux qui ont des projets) ────────────────
  const encarts = [];
  OUTRE_MER.filter(nom => parRegion[nom]).forEach(nom => {
    const feat = geo.features.find(f => f.properties.nom === nom);
    if (!feat) return;
    const box = document.createElement('div');
    box.className = 'encart';
    box.innerHTML = `<div class="encart-titre">${nom} <span class="nb">${parRegion[nom]}</span></div><div class="encart-carte"></div>`;
    document.getElementById('encarts').appendChild(box);
    const mini = L.map(box.querySelector('.encart-carte'), SANS_INTERACTION);
    relief(mini);
    const forme = L.geoJSON(feat, { style: STYLE_REGION, interactive: true, onEachFeature: (f, l) => rendreCliquable(l, nom) }).addTo(mini);
    masqueHors(mini, feat, 0.5);
    const couche = L.layerGroup().addTo(mini);
    const liste = projets.filter(p => p.region === nom);
    encarts.push(() => {
      mini.invalidateSize();
      mini.fitBounds(forme.getBounds(), { padding: [6, 6], animate: false });
      // Encarts : même taille de point que la métropole.
      dessinerPoints(mini, couche, liste, Math.max(6, Math.min(11, Math.round(map.getSize().x / 120))));
    });
  });

  const tout = () => { cadrer(); encarts.forEach(f => f()); };
  tout();
  let t;
  new ResizeObserver(() => { clearTimeout(t); t = setTimeout(tout, 120); }).observe(document.getElementById('carte'));
})();
</script>
</body>
</html>
